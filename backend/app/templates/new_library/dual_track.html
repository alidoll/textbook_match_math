<!DOCTYPE html>

<html lang="zh-CN">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>双轨建块实验 · {{ page_title }}</title>

  {% include "_favicon.html" %}

  {% include "_theme_css.html" %}

  <link rel="stylesheet" href="/static/new_library/dual_track.css?v={{ static_v }}">

</head>

<body class="dt-layout">

  <header class="dt-header">

    <div class="dt-header-row">

      <a class="dt-back" id="link-annotate" href="#">← 返回建块</a>

      <div class="dt-title-wrap">

        <h1 id="page-title">{{ page_title }}</h1>

        <p class="dt-sub" id="page-sub">加载中…</p>

      </div>

    </div>

    <nav class="dt-substeps dt-substeps--prep" aria-label="前置5道工序">

      <span class="dt-substeps-label">前置</span>

      <button type="button" class="dt-step-btn dt-step-btn--prep" data-step="text_ocr">1 文字OCR</button>

      <button type="button" class="dt-step-btn dt-step-btn--prep" data-step="image_ocr">2 图片OCR</button>

      <button type="button" class="dt-step-btn dt-step-btn--prep" data-step="block_match">3 栏目·聚类</button>

      <button type="button" class="dt-step-btn dt-step-btn--prep" data-step="prescan">4 对照预判</button>

      <button type="button" class="dt-step-btn dt-step-btn--prep" data-step="pair_review">5 确认对照</button>

    </nav>

    <nav class="dt-substeps" aria-label="①教材轨分步">

      <span class="dt-substeps-label">① 教材</span>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="tb_units">1-1 单元</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="tb_sources">1-2 旧教材</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="tb_scores">1-3 打分</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="tb_classify">1-4 分类</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="textbook">1-5 一块表</button>

    </nav>

    <nav class="dt-substeps" aria-label="②课件轨分步">

      <span class="dt-substeps-label">② 课件</span>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cw_sources">2-1 参照源</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cw_scores">2-2 打分</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cw_illustration">2-3 插图</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cw_status">2-4 状态</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="courseware">2-5 二块表</button>

    </nav>

    <nav class="dt-substeps" aria-label="③对照分步">

      <span class="dt-substeps-label">③ 对照</span>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cmp_join">3-1 关联</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cmp_mark">3-2 标记</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="cmp_summary">3-3 统计</button>

      <button type="button" class="dt-step-btn dt-step-btn--sub" data-step="compare">3-4 总表</button>

    </nav>

    <nav class="dt-steps dt-steps--main" aria-label="收尾">
      <button type="button" class="dt-step-btn dt-step-btn--ghost" id="dt-btn-clear">清空结果</button>
      <button type="button" class="dt-step-btn" data-step="fusion">④ 融合</button>
      <button type="button" class="dt-step-btn dt-step-btn--ghost" data-step="live">现网块</button>
    </nav>

    <label class="dt-llm-toggle" id="dt-llm-toggle-wrap">

      <input type="checkbox" id="dt-use-llm" checked>

      启用豆包方案（仅 1-5 一块表；③ 沿用其缓存）

    </label>

    <p class="dt-mode" id="dt-mode-line">双轨逐步实验 · 点击上方步骤运行</p>

    <p class="dt-run-status" id="dt-run-status" hidden></p>

    <p class="dt-prep-status" id="dt-prep-status">前置工序检测中…</p>

    <p class="dt-readonly-note" id="dt-readonly-note">本页只读预览，不能改原子归属。要编辑请先返回建块页解锁。</p>

  </header>



  <main class="dt-main">

    <aside class="dt-panel dt-panel-detail" aria-label="步骤说明与统计">

      <h2 class="dt-panel-title">步骤结果</h2>

      <div class="dt-panel-body" id="dt-detail"></div>

    </aside>



    <section class="dt-panel dt-panel-page" aria-label="教材对照">

      <div class="dt-center-tabs" role="tablist">

        <button type="button" class="dt-center-tab is-active" data-center-view="new" role="tab">新教材</button>

        <button type="button" class="dt-center-tab" data-center-view="textbook" role="tab">旧教材</button>

        <button type="button" class="dt-center-tab" data-center-view="courseware" role="tab">旧课件</button>

        <span class="dt-center-tab-hint">切换标签可全屏查看整页（各自滚动）</span>

      </div>

      <div class="dt-page-toolbar">

        <button type="button" class="btn btn-sm" id="dt-page-prev">上一页</button>

        <span id="dt-page-info">—</span>

        <button type="button" class="btn btn-sm" id="dt-page-next">下一页</button>

        <button type="button" class="btn btn-sm btn-secondary" id="dt-fit-toggle" title="缩小以在一屏内看全页高">整页适应</button>

      </div>

      <div class="dt-viewport-wrap dt-viewport-wrap--full" id="dt-viewport-wrap">

        <div class="dt-viewport" id="dt-viewport">

          <img id="dt-page-img" alt="教材页" hidden>

          <div id="dt-atom-layer"></div>

        </div>

      </div>

      <p class="hint dt-page-caption" id="dt-page-caption"></p>

    </section>



    <aside class="dt-panel dt-panel-blocks" aria-label="区块列表">

      <h2 class="dt-panel-title" id="dt-blocks-title">区块列表</h2>

      <div class="dt-panel-body" id="dt-blocks"></div>

    </aside>

  </main>



  <div id="toast" hidden></div>

  <script>

    window.DUAL_TRACK_LESSON_UID = {{ lesson_uid|tojson }};

    window.DUAL_TRACK_API = '/api/new-library';

  </script>

  <script src="/static/new_library/dual_track.js?v={{ static_v }}"></script>

</body>

</html>
